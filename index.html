<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prepare – konceptprototype</title>
<style>
:root{
  --navy:#16304f; --navy2:#1f3d63; --ink:#1d2733; --muted:#6c7785; --line:#dde3ea;
  --bg:#eef2f6; --side:#e6eaee; --sel:#c6d5e1; --blue:#1777cf; --blue-d:#0f62ad; --blue-soft:#e6f0fa;
  --green:#2fa84f; --green-soft:#e5f5e9; --red:#e23b3b; --amber:#f2a33a; --amber-soft:#fdf1df;
  --violet:#7a5af5; --violet-soft:#efeafe; --live1:#8b1d7d; --live2:#2c1f6e;
  --hl-y:rgba(238,232,90,.55); --hl-g:rgba(120,205,110,.45);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;background:#d9dee5;color:var(--ink);font-size:14px}
button{font:inherit;cursor:pointer}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
/* presenter bar */
.pbar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pbar .ttl{font-weight:700}
.pbar .badge{background:var(--amber-soft);color:#9a5b00;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:.3px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.steps button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;color:var(--muted)}
.steps button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.devtog{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.devtog button{border:0;background:#fff;padding:6px 12px;color:var(--muted)}
.devtog button.on{background:var(--navy);color:#fff}
.stage{display:flex;justify-content:center;padding:24px 16px 8px}
.device{background:#1a1a1a;border-radius:34px;padding:14px;box-shadow:0 20px 50px rgba(22,48,79,.25);transition:width .3s}
.device.ipad{width:min(1200px,100%)}
.device.iphone{width:410px;border-radius:46px}
.screen{background:var(--bg);border-radius:22px;overflow:hidden;height:740px;display:flex;flex-direction:column;position:relative}
.device.iphone .screen{border-radius:34px;height:800px}
.notes{max-width:1200px;margin:10px auto 30px;padding:0 16px}
.notes details{background:#fff;border-radius:12px;padding:12px 16px;border:1px solid var(--line)}
.notes summary{font-weight:700;cursor:pointer}
.notes p{margin:8px 0 0;color:#3a4556;line-height:1.5}
.who{font-size:12px;color:var(--muted);margin-left:8px;font-weight:400}

/* ===== iPad participant app chrome ===== */
.topbar{display:flex;align-items:center;height:62px;background:#f2f3f5;border-bottom:1px solid #d4d9df;flex-shrink:0}
.topbar .left{width:300px;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:20px;height:100%;border-right:1px solid #d4d9df}
.topbar .left svg{width:24px;height:24px}
.topbar .tools{display:flex;align-items:center;gap:18px;padding:0 20px;color:#222}
.topbar .bell{position:relative}
.topbar .bell b{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:50%;width:17px;height:17px;font-size:11px;display:grid;place-items:center}
.arrows{display:flex;background:#e2e5e9;border-radius:10px;padding:6px 8px;gap:14px}
.topbar .title{flex:1;text-align:center;font-weight:600;font-size:19px}
.topbar .right{display:flex;gap:20px;padding:0 20px;color:#222}
.topbar .right .ai{color:var(--violet)}
.body{flex:1;display:flex;min-height:0;position:relative}
.side{width:300px;background:var(--side);overflow:auto;flex-shrink:0;padding:18px 14px}
.side .lbl{font-size:13px;color:#7b8590;letter-spacing:.6px;margin:4px 10px 12px;text-transform:uppercase}
.scard{display:flex;align-items:center;gap:12px;background:#f3f4f6;border-radius:12px;padding:14px 12px;margin-bottom:8px;cursor:pointer}
.scard.on{background:var(--sel)}
.scard .tt{flex:1;font-size:14.5px;font-weight:500;line-height:1.3}
.scard .tt small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.circ{width:44px;height:44px;border-radius:50%;border:2px solid var(--navy);display:grid;place-items:center;position:relative;color:var(--navy);flex-shrink:0}
.circ svg{width:20px;height:20px}
.circ b{position:absolute;top:-6px;right:-6px;background:var(--navy);color:#fff;border-radius:50%;width:19px;height:19px;font-size:11px;display:grid;place-items:center}
.chev{color:#4f5b68}
.docwrap{flex:1;background:#e3e6ea;overflow:auto;padding:14px 16px 90px;position:relative}
.page{background:#fff;max-width:760px;margin:0 auto;padding:40px 48px 60px;box-shadow:0 1px 6px rgba(0,0,0,.12);font-family:Helvetica,Arial,sans-serif;position:relative}
.page h1{font-weight:400;font-size:28px;margin:0 0 22px;line-height:1.25}
.page h4{font-size:19px;margin:24px 0 10px;font-weight:700;text-transform:uppercase}
.page p,.page li{font-size:16.5px;line-height:1.6;color:#222}
.page ol{padding-left:28px}
.mark-y{background:var(--hl-y);border-radius:10px;padding:2px 4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.mark-g{background:var(--hl-g);border-radius:10px;padding:2px 4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cbub{position:absolute;left:-26px;width:44px;height:44px;border-radius:50%;background:#1a73b9;color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.cbub svg{width:22px;height:22px}
.bilag{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.bil{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.bil svg{width:18px;height:18px;color:var(--red)}
.live-pill{position:absolute;left:320px;bottom:72px;display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:20px;padding:8px 22px 8px 14px;border-radius:30px;background:linear-gradient(90deg,var(--live1),var(--live2));cursor:pointer;box-shadow:0 3px 10px rgba(60,20,100,.35);border:0}
.live-pill .L{font-size:26px;font-weight:800;line-height:1}
.annot{position:absolute;left:calc(300px + (100% - 674px)/2);transform:translateX(-50%);bottom:12px;display:flex;align-items:center;gap:22px;background:#e9ebee;border-radius:12px;padding:8px 20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.pen{display:flex;flex-direction:column;align-items:center;gap:3px;color:#333}
.pen i{display:block;width:22px;height:3px;border-radius:2px}
.annot .pg{border-left:1px solid #cfd3d8;padding-left:18px;font-size:16px;color:#333}
/* AI popover */
.pop{width:360px;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.18);margin:14px 14px 14px 0;display:flex;flex-direction:column;min-height:0;flex-shrink:0}
.pop .ph{display:flex;align-items:center;justify-content:center;position:relative;padding:16px;border-bottom:1px solid #e6e9ed;font-weight:700;font-size:18px}
.pop .ph .plus{position:absolute;right:18px;color:var(--blue);font-size:24px;font-weight:400}
.seg{display:flex;margin:12px 14px 4px;background:#eef0f3;border-radius:9px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:7px 4px;font-size:13px;color:#4a5562;font-weight:600}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.pbody{flex:1;overflow:auto;padding:12px 16px}
.to{color:#8a939e;font-size:14px;margin-bottom:10px}
.meta{display:flex;justify-content:space-between;font-size:11px;color:#9aa2ac;margin:6px 2px 4px}
.bub{padding:11px 14px;border-radius:16px;line-height:1.45;font-size:14px;margin-bottom:8px}
.bub.me{background:var(--blue);color:#fff;border-top-right-radius:4px;margin-left:30px}
.bub.ai{background:#f0f2f5;border-top-left-radius:4px;margin-right:20px}
.bub.other{background:#f0f2f5;border-top-left-radius:4px;margin-right:30px}
.src{font-size:11px;color:var(--blue);background:var(--blue-soft);border-radius:6px;padding:1px 6px;margin:4px 4px 0 0;display:inline-block;white-space:nowrap}
.bub.me .src{background:rgba(255,255,255,.2);color:#fff}
.spark{color:var(--violet);font-weight:700}
.ai-list{margin:8px 0 0;padding-left:18px}.ai-list li{margin-bottom:9px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.chip{border:1px solid #cfe0f3;background:#f4f9fe;color:var(--blue-d);border-radius:16px;padding:5px 10px;font-size:12px}
.hist{border:1px dashed #c9d2dd;border-radius:10px;padding:10px;margin-top:12px;font-size:12.5px;line-height:1.5}
.compose{padding:12px 16px 14px;border-top:1px solid #eef0f3}
.compose input{width:100%;background:var(--blue);color:#fff;border:0;border-radius:4px 14px 14px 14px;padding:13px 16px;font:inherit;font-size:15px;outline:none}
.compose input::placeholder{color:rgba(255,255,255,.75)}
.compose .send{display:block;margin:8px 0 0 auto;border:0;background:none;color:var(--blue);font-size:17px;font-weight:600}
.typing{display:inline-flex;gap:3px}.typing i{width:6px;height:6px;border-radius:50%;background:#9aa3b2;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.3}50%{opacity:1}}
/* overview (participant) */
.home{flex:1;overflow:auto;padding:24px 28px}
.home h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;margin-top:18px}
.h2{font-size:13px;color:#7b8590;letter-spacing:.6px;text-transform:uppercase;margin:0 0 10px}
.mcard{display:flex;align-items:center;gap:14px;background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;border:1px solid transparent}
.mcard:hover{border-color:var(--blue)}
.dbox{width:54px;text-align:center;border-radius:10px;border:2px solid var(--navy);padding:4px 0;flex-shrink:0;color:var(--navy)}
.dbox b{display:block;font-size:20px}.dbox span{font-size:11px;text-transform:uppercase}
.mcard .info{flex:1}.mcard h3{margin:0 0 3px;font-size:16px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;display:inline-block;white-space:nowrap}
.t-blue{background:var(--blue-soft);color:var(--blue-d)}.t-green{background:var(--green-soft);color:#1d7a37}.t-amber{background:var(--amber-soft);color:#9a5b00}
.t-grey{background:#eceff3;color:#5b6575}.t-violet{background:var(--violet-soft);color:#5236c9}.t-red{background:#fde8e8;color:#b52a2a}
.aibox{background:#fff;border-radius:12px;padding:18px;border-left:4px solid var(--violet)}
.wcard{background:#fff;border-radius:12px;padding:16px}
.btn{border:0;border-radius:6px;padding:10px 16px;font-weight:600}
.btn-p{background:var(--blue);color:#fff}.btn-p:hover{background:var(--blue-d)}
.btn-o{background:#fff;color:var(--blue);border:1px solid #b9d2ea}
.btn:disabled{opacity:.5;cursor:default}
.ring text{font-size:9px;fill:var(--muted)}

/* ===== Web admin chrome ===== */
.whead{display:flex;align-items:center;gap:14px;height:68px;background:#fff;border-bottom:1px solid var(--line);padding:0 20px 0 0;flex-shrink:0}
.whead .menu{width:76px;display:grid;place-items:center;color:var(--blue)}
.wlogo{display:flex;align-items:center;gap:10px;line-height:1.05}
.wlogo .mk{width:34px;height:34px;border-radius:6px;background:var(--navy);display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;position:relative;overflow:hidden}
.wlogo .mk:after{content:"";position:absolute;right:0;top:0;width:12px;height:12px;background:var(--blue)}
.wlogo span{font-size:15px;color:#333}.wlogo b{font-size:19px;font-weight:600;display:block}
.whead .sp{flex:1}
.orgsel{border:1px solid #cfd6de;border-radius:6px;padding:7px 12px;font-size:14px;background:#fff}
.wava{width:44px;height:44px;border-radius:50%;background:#dcebf8;color:var(--blue);display:grid;place-items:center;font-size:17px}
.wbody{flex:1;display:flex;min-height:0}
.rail{width:76px;background:var(--navy);display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:26px;color:#fff;flex-shrink:0}
.rail .on{width:46px;height:46px;border:2px solid rgba(255,255,255,.7);border-radius:50%;display:grid;place-items:center}
.wmain{flex:1;overflow:auto;padding:22px 26px}
.mhead{display:grid;grid-template-columns:380px 1fr;gap:20px;margin-bottom:20px}
.mbox{background:#fff;border-radius:6px;padding:18px 22px}
.mbox h2{margin:0 0 10px;font-size:20px}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:15px}
.mrow svg{width:18px;height:18px;color:#333}
.mrow a{color:var(--blue);text-decoration:underline}
.wtabs{display:flex;background:#fff;border-radius:6px 6px 0 0}
.wtabs div{padding:14px 26px;font-weight:600;color:#555;display:flex;align-items:center;gap:8px}
.wtabs .on{color:#222;border-top:3px solid var(--blue)}
.wtabpane{background:#fff;border-radius:0 0 6px 6px;padding:18px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.livebadge{display:inline-flex;align-items:center;gap:6px;color:#fff;font-weight:700;font-size:12px;padding:3px 10px;border-radius:20px;background:linear-gradient(90deg,var(--live1),var(--live2))}
.cols{display:grid;grid-template-columns:380px 1fr;gap:20px}
.aitem{display:flex;align-items:center;gap:12px;background:#fff;padding:14px;border:1px solid transparent;cursor:default}
.aitem+.aitem{border-top:1px solid #edf0f3}
.aitem.on{border:2px solid #222}
.ncirc{width:46px;height:46px;border-radius:50%;border:2px solid var(--blue);color:var(--blue);display:grid;place-items:center;font-size:19px;flex-shrink:0}
.aitem .txt{flex:1;border:1px solid #cfd6de;border-radius:4px;padding:8px 10px;font-size:14px;min-height:44px;display:flex;align-items:center}
.ok{color:var(--green)}
.okc{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;flex-shrink:0}
.wpanel{background:#fff;border-radius:6px}
.wpanel .wh{text-align:center;padding:14px;border-bottom:1px solid #edf0f3;font-size:18px}
.wsec{padding:16px 22px}
.wsec h5{margin:0 0 10px;color:var(--blue);font-size:15px;letter-spacing:.3px;text-transform:uppercase}
.vote{display:flex;gap:10px;margin:4px 0 12px}
.vote div{flex:1;text-align:center;border:1px solid var(--line);border-radius:6px;padding:10px}
.vote b{font-size:26px;display:block}
.draft{background:#f8fafc;border:1px dashed #b9d2ea;border-radius:6px;padding:14px;line-height:1.55;font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.done-ok{color:#1d7a37;font-weight:700}
.action{display:flex;gap:14px;align-items:center;padding:14px 16px;background:#fff;border-radius:6px;margin-bottom:10px}
.action .st{margin-left:auto;font-size:13px;white-space:nowrap}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.flow .node{padding:6px 10px;border-radius:6px;font-size:12px;font-weight:700}
.flow .arr{color:var(--muted)}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid #cfd6e2;border-top-color:var(--blue);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;color:var(--blue);letter-spacing:.4px;padding:10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid #f0f2f5}
.bar{height:6px;background:#eef1f6;border-radius:4px;overflow:hidden;width:90px}.bar i{display:block;height:100%;background:var(--blue)}
.stat{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.stat div{flex:1;min-width:120px;background:#fff;border-radius:6px;padding:14px}
.stat b{font-size:24px;display:block}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;border:1px solid #cfd6de;border-radius:6px;padding:11px 12px;font:inherit}
.res{border-left:4px solid var(--violet);background:#fff;padding:12px 14px;border-radius:6px;margin-bottom:12px;font-size:14px;line-height:1.55}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;transition:.3s;opacity:0;z-index:9}
.toast.on{transform:translateX(-50%);opacity:1}

/* ===== iPhone adaptations ===== */
.device.iphone .topbar .left{width:auto;border:0;font-size:16px}
.device.iphone .topbar .tools,.device.iphone .topbar .right .hm{display:none}
.device.iphone .topbar .title{font-size:16px}
.device.iphone .side{display:none}
.device.iphone .body{flex-direction:column;overflow:auto}
.device.iphone .docwrap{overflow:visible;padding:10px 10px 20px}
.device.iphone .page{padding:22px 20px}
.device.iphone .page h1{font-size:22px}
.device.iphone .cbub{display:none}
.device.iphone .pop{width:auto;margin:0 10px 14px}
.device.iphone .pbody{overflow:visible}
.device.iphone .annot{display:none}
.device.iphone .live-pill{position:static;margin:4px 10px 10px;justify-content:center}
.device.iphone .grid2,.device.iphone .mhead,.device.iphone .cols{grid-template-columns:1fr}
.device.iphone .rail{display:none}
.device.iphone .whead .menu{width:50px}
.device.iphone .orgsel,.device.iphone .hm{display:none}
.device.iphone .home,.device.iphone .wmain{padding:16px}
</style>
</head>
<body>

  <span class="ttl">Prepare 2027</span><span class="badge">KONCEPTPROTOTYPE</span>

</div>

<div class="notes"><details open><summary>Talepunkter til denne skærm <span class="who" id="who"></span></summary><p id="talk"></p></details></div>
<div class="toast" id="toast"></div>

 {t:'Udbud af kantinedrift',m:'1 bilag',n:1},
 {t:'Personalesag',m:'Lukket punkt',n:0,lock:true}

 <div class="row" style="margin-top:8px">${st==='done'?`<span class="done-ok">Alle opgaver er oprettet og koblet til beslutningen.</span><button class="btn btn-p" style="margin-left:auto" onclick="go('opfolgning')">Se opfølgning →</button>`:`<span style="flex:1"></span><button class="btn btn-o" onclick="toast('Opgaverne kan redigeres før oprettelse')">Redigér</button><button class="btn btn-p" ${st==='run'?'disabled':''} onclick="runActions()">Opret alle 3</button>`}</div>
 <div class="hist" style="margin-top:18px;background:#fff"><b>Hvorfor det betyder noget:</b> I dag stopper mødesystemet ved referatet. Her bliver beslutningen sporbar hele vejen fra dagsorden til gennemførelse – på tværs af tre produkter, som kommunerne allerede bruger.</div>`,4);
}
function runActions(){S.actions='run';S.prog=0;render();const t=setInterval(()=>{S.prog++;if(S.prog>=3){clearInterval(t);S.actions='done'}render()},700)}
function vOpf(){
 const R=[['Klimahandleplan 2027–2030','ØU','09.12.26','Teknik og Miljø',10,'t-green','Netop oprettet'],
  ['Klimahandleplan 2022–2026','BY','14.03.22','Teknik og Miljø',67,'t-amber','2 indsatser forsinket'],
  ['Ny skolestruktur, Nordområdet','BY','27.05.25','Børn og Unge',85,'t-blue','I gang'],
  ['Digital borgerservice 2026','ØU','12.02.26','Borgerservice',100,'t-grey','Gennemført'],
  ['Udbud af ældremad','SSU','03.09.25','Sundhed og Omsorg',40,'t-red','Frist overskredet']];
 return webChrome(`<h2 style="margin:0 0 4px;font-size:22px">Beslutningssporing</h2><div class="sub">Følg hvordan politiske beslutninger bliver ført ud i livet</div>
 <div class="stat"><div><b>128</b><span class="sub">beslutninger i 2026</span></div><div><b style="color:#1d7a37">74 %</b><span class="sub">gennemført til tiden</span></div><div><b style="color:#b52a2a">9</b><span class="sub">forsinkede</span></div></div>
 <div class="search"><input id="sq" value="Hvad har vi besluttet om kollektiv trafik i landdistrikterne?"><button class="btn btn-p" onclick="memSearch()">✦ Søg</button></div>
 <div id="sres"></div>
 <div class="wpanel" style="padding:6px 10px;overflow:auto"><table><tr><th>Beslutning</th><th class="hm">Udvalg</th><th class="hm">Dato</th><th class="hm">Ansvarlig</th><th>Fremdrift</th><th>Status</th></tr>
 ${R.map(r=>`<tr><td><b>${r[0]}</b></td><td class="hm">${r[1]}</td><td class="hm">${r[2]}</td><td class="hm">${r[3]}</td><td><div class="bar"><i style="width:${r[4]}%"></i></div></td><td><span class="tag ${r[5]}">${r[6]}</span></td></tr>`).join('')}</table></div>`,0);
}
function memSearch(){$('#sres').innerHTML='<div class="res"><span class="typing"><i></i><i></i><i></i></span></div>';setTimeout(()=>{$('#sres').innerHTML=`<div class="res"><b>3 relevante beslutninger fundet:</b><br>• Byrådet 14.03.2022: Pulje på 2 mio. kr. til flextrafik i landdistrikter <span class="src">BY pkt. 7</span><br>• Klima- og Miljøudvalget 05.06.2024: Forsøg med samkørsel i 3 landsbyer – lav brug ved evaluering <span class="src">KMU pkt. 4</span><br>• Økonomiudvalget 09.12.2026: Indsatsen justeret efter 14 høringssvar <span class="src">ØU pkt. 3</span></div>`},900)}

function render(){
 $('#steps').innerHTML=STEPS.map(s=>`<button class="${S.screen===s[0]?'on':''}" onclick="go('${s[0]}')">${s[1]}</button>`).join('');
 $('#screen').innerHTML={oversigt:vOversigt,moede:vMoede,live:vLive,handling:vHandling,opfolgning:vOpf}[S.screen]();
 $('#talk').textContent=TALK[S.screen];$('#who').textContent='· '+WHO[S.screen];
 const c=$('.pbody');if(c&&S.tab==='ask')c.scrollTop=1e5;
}
function setDev(d){S.dev=d;document.querySelectorAll('[data-dev]').forEach(x=>x.classList.toggle('on',x.dataset.dev===d));$('#device').className='device '+d;render()}
document.querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>setDev(b.dataset.dev));
if(window.innerWidth<760)setDev('iphone');else render();
</script>
